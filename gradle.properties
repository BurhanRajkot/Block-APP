org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Room 2.6.1's annotation processor fails under KSP2 ("unexpected jvm signature V" from
# KspAAWorkerAction) and takes the whole build down at :app:kspDebugKotlin, so KSP runs on the
# KSP1 backend. This is a holding position, not a preference: KSP1 is deprecated and the real fix
# is Room 2.7+, which supports KSP2 but is built against a newer compileSdk than this app's 34.
# Drop this line and the KSP pin in build.gradle.kts together with that Room upgrade — and
# re-read invariant 7 first, because a Room bump is a schema-migration question, not just a
# version bump.
ksp.useKSP2=false
